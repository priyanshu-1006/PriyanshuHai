name: Refresh GitHub activity

on:
  schedule:
    # 05:47 UTC = 11:17 AM IST. Avoid the busy start of the hour.
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-github-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check daily refresh
        id: cadence
        run: node scripts/fetch-github.mjs --check-due
      - name: Install dependencies
        if: steps.cadence.outputs.refresh == 'true'
        run: npm ci
      - name: Fetch current GitHub activity
        if: steps.cadence.outputs.refresh == 'true'
        env:
          GITHUB_USER: priyanshu-1006
          GITHUB_TOKEN: ${{ secrets.GITHUB_ACTIVITY_TOKEN || github.token }}
        run: npm run sync:github -- --strict
      - name: Validate refreshed portfolio
        if: steps.cadence.outputs.refresh == 'true'
        run: |
          npm test
          npm run check:release
          npm run build
      - name: Commit the refreshed data
        id: commit
        if: steps.cadence.outputs.refresh == 'true'
        env:
          GIT_AUTHOR_NAME: Priyanshu Chaurasia
          GIT_AUTHOR_EMAIL: ${{ vars.PORTFOLIO_GIT_EMAIL || '220466360+priyanshu-1006@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- src/data/github.json
          if git diff --cached --quiet; then
            echo 'No refreshed data to commit.'
            exit 0
          fi
          git commit -m "chore: refresh GitHub activity ($(date -u +%F))"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger optional Vercel deploy hook
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --output /dev/null --request POST "$VERCEL_DEPLOY_HOOK"
          fi
